name: Validate podcast website
on:
  push:
    branches: [main, ops/site-upgrade-20261103]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/build.py
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/goal.test.mjs tests/letters.test.mjs
